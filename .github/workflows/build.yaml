name: Build and deploy to dev

# Build once: every merge to main builds the image once, into dev's registry
# (the only one), and deploys it to dev. Higher environments get that exact
# image later through promotion PRs (promote.yaml), never a rebuild.
#
# Merges that only change deploy/ (promotions), Terraform (terraform.yaml
# applies it) or docs don't build. Only the newest commit of main is built:
# a run for an older commit (a re-run, or a merge overtaken by the next one)
# is skipped, so "latest" never moves back.
#
# Build numbers come from the registry (highest build-<n> + 1), not from the
# run counter, so they stay unique even if this file is renamed or copied.
on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
      - "terraform/**"
      - ".github/terraform-envs.json"
      - ".github/scripts/terraform*.sh"
      - ".github/workflows/terraform*.yaml"
      - "**/*.md"
  workflow_dispatch:

# Least privilege: read the repo, and mint an OIDC token for WIF.
permissions:
  contents: read
  id-token: write

jobs:
  newest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      newest: ${{ steps.main.outputs.newest }}
    steps:
      - name: Is this the newest commit of main?
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${head}" = "${GITHUB_SHA}" ]; then
            echo "newest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "newest=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipped: ${GITHUB_SHA::7} on ${GITHUB_REF_NAME} isn't the newest commit of main (${head::7}); only that one is built."
          fi

  dev:
    needs: newest
    if: needs.newest.outputs.newest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev

    # Shared with PR previews: never two deploys to dev at once.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      DEPLOY_SA: ${{ vars.DEPLOY_SA }}
      REGISTRY: ${{ vars.REGION }}-docker.pkg.dev
      IMAGE: ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/rotator-repo/rotator
      JOB_NAME: postgres-password-rotator-dev

    steps:
      - name: Check environment variables
        run: |
          for name in PROJECT_ID REGION WIF_PROVIDER DEPLOY_SA; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable ${name} is not set on the dev environment"
              exit 1
            fi
          done

      # Third-party actions are pinned to full commit SHAs (tags are mutable).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keyless auth via Workload Identity Federation.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      # Highest build-<n> in the registry + 1 (1 for an empty registry). A
      # build that fails before dev runs it gets no build-<n> tag, so its
      # number is used again by the next build.
      - name: Pick the build number
        run: |
          source .github/scripts/promotion.sh
          # Fails (rather than starting again at 1) if the registry can't be read.
          packages="$(gcloud artifacts packages list --repository=rotator-repo \
            --location="${REGION}" --project="${PROJECT_ID}" --format="value(name.basename())")"
          last=0
          if grep -qx rotator <<< "${packages}"; then
            tags="$(all_tags "${IMAGE}")"
            last="$(sed -n 's/^build-\([0-9]*\) .*/\1/p' <<< "${tags}" | sort -n | tail -1)"
          fi
          echo "BUILD=$(( ${last:-0} + 1 ))" >> "${GITHUB_ENV}"
          echo "Build number: $(( ${last:-0} + 1 ))"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGISTRY}" --quiet

      - name: Build image
        run: |
          docker build \
            --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=build-${BUILD}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            .

      - name: Push image
        id: push
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          digest="$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:${GITHUB_SHA}" | grep "^${IMAGE}@")"
          echo "image_ref=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Pushed ${digest}"

      # Point the job at the exact digest, so what runs is immutable. Clear
      # the preview label: dev now runs main again.
      - name: Update Cloud Run Job
        env:
          IMAGE_REF: ${{ steps.push.outputs.image_ref }}
        run: |
          gcloud run jobs update "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE_REF}" \
            --remove-labels=preview_pr \
            --quiet

      # Tagged only after dev runs it: a build-<n> tag means "passed dev",
      # which is what makes it promotable to test.
      - name: Tag build
        env:
          IMAGE_REF: ${{ steps.push.outputs.image_ref }}
        run: |
          for tag in "build-${BUILD}" latest deployed-dev; do
            gcloud artifacts docker tags add "${IMAGE_REF}" "${IMAGE}:${tag}" --quiet
          done

      - name: Summary
        env:
          IMAGE_REF: ${{ steps.push.outputs.image_ref }}
        run: |
          {
            echo "### Build ${BUILD} deployed to dev"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE_REF}\`"
            echo ""
            echo "Promote it with Actions → **Create promotion PR**."
          } >> "${GITHUB_STEP_SUMMARY}"
