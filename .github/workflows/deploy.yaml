name: Deploy promoted build

# Runs when a promotion PR (one that changes deploy/<env>.json) is merged.
# Deploys exactly the image the file names, from dev's registry; nothing is
# rebuilt or copied.
on:
  push:
    branches: [main]
    paths:
      - "deploy/*.json"

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      envs: ${{ steps.envs.outputs.envs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Which environments changed
        id: envs
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          envs="$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" -- 'deploy/*.json' \
            | sed -n 's|^deploy/\([a-z]*\)\.json$|\1|p' | jq -Rnc '[inputs | select(length > 0)]')"
          echo "envs=${envs}" >> "${GITHUB_OUTPUT}"
          echo "Changed: ${envs}"

  deploy:
    needs: detect
    if: needs.detect.outputs.envs != '[]'
    strategy:
      matrix:
        env: ${{ fromJSON(needs.detect.outputs.envs) }}
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ matrix.env }}

    concurrency:
      group: deploy-${{ matrix.env }}
      cancel-in-progress: false

    env:
      TARGET: ${{ matrix.env }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      DEPLOY_SA: ${{ vars.DEPLOY_SA }}
      REPO: ${{ vars.REGISTRY_REPO }}

    steps:
      - name: Check variables
        run: |
          for name in PROJECT_ID REGION WIF_PROVIDER DEPLOY_SA REPO; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable ${name} is not set (environment ${TARGET}, or repository REGISTRY_REPO)"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the promotion record
        id: record
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          source .github/scripts/promotion.sh
          is_enabled "${TARGET}" || { echo "::error::${TARGET} is not enabled (promotion.sh)"; exit 1; }
          file="deploy/${TARGET}.json"
          check_record "${file}" "${REPO}"
          from="$(previous_env "${TARGET}")"
          image="$(jq -r .image "${file}")"
          if [ "${from}" != "dev" ] \
             && [ "$(jq -r .image "deploy/${from}.json" 2>/dev/null)" != "${image}" ] \
             && ! ran_before "${TARGET}" "${image}" "${BEFORE}"; then
            echo "::error::${TARGET} can only get the build ${from} runs, or roll back to a build it ran before"
            exit 1
          fi
          {
            echo "build=$(jq -r .build "${file}")"
            echo "commit=$(jq -r .commit "${file}")"
            echo "image=$(jq -r .image "${file}")"
            echo "job=$(job_name "${TARGET}")"
          } >> "${GITHUB_OUTPUT}"

      # Dev's identity: check the image is the build the record claims.
      - name: Authenticate to the registry
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.REGISTRY_WIF_PROVIDER }}
          service_account: ${{ vars.REGISTRY_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Verify image
        env:
          BUILD: ${{ steps.record.outputs.build }}
          COMMIT: ${{ steps.record.outputs.commit }}
          IMAGE: ${{ steps.record.outputs.image }}
        run: |
          source .github/scripts/promotion.sh
          tags="$(image_tags "${REPO}/rotator" "${IMAGE#*@}")"
          grep -qx "build-${BUILD}" <<< "${tags}" \
            || { echo "::error::${IMAGE} is not build ${BUILD} (missing, or cleaned up)"; exit 1; }
          grep -qx "${COMMIT}" <<< "${tags}" \
            || { echo "::error::${IMAGE} was not built from ${COMMIT}"; exit 1; }

      - name: Authenticate to ${{ matrix.env }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Update Cloud Run Job
        env:
          IMAGE: ${{ steps.record.outputs.image }}
          JOB_NAME: ${{ steps.record.outputs.job }}
        run: |
          gcloud run jobs update "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --quiet

      # Done after the deploy, as dev again: deployed-<env> moves to the image
      # the env now runs (kept by cleanup); the candidate tag is no longer
      # needed.
      - name: Authenticate to the registry (tags)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.REGISTRY_WIF_PROVIDER }}
          service_account: ${{ vars.REGISTRY_DEPLOY_SA }}

      - name: Update tags
        env:
          BUILD: ${{ steps.record.outputs.build }}
          IMAGE: ${{ steps.record.outputs.image }}
        run: |
          gcloud artifacts docker tags add "${IMAGE}" "${REPO}/rotator:deployed-${TARGET}" --quiet
          gcloud artifacts docker tags delete "${REPO}/rotator:candidate-${TARGET}-build-${BUILD}" --quiet \
            || echo "No candidate tag to remove."

      - name: Summary
        env:
          BUILD: ${{ steps.record.outputs.build }}
          COMMIT: ${{ steps.record.outputs.commit }}
          IMAGE: ${{ steps.record.outputs.image }}
          JOB_NAME: ${{ steps.record.outputs.job }}
        run: |
          {
            echo "### Build ${BUILD} deployed to ${TARGET}"
            echo "- Job: \`${JOB_NAME}\`"
            echo "- Commit: \`${COMMIT}\`"
            echo "- Image: \`${IMAGE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
