name: Terraform apply

# Applies one environment; called by terraform.yaml, in order. Plans again
# first (the PR's plan may be out of date), then applies exactly that plan.
# Stops before applying if the plan destroys or replaces anything other than
# IAM bindings, unless allow_destroy is set (Run workflow on terraform.yaml).
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      allow_destroy:
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  # Keep in step with terraform.yaml.
  TERRAFORM_VERSION: "1.17.0"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment's protection rules (reviewers, main only) apply here.
    environment: ${{ inputs.environment }}

    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: terraform

    env:
      TARGET: ${{ inputs.environment }}
      ALLOW_DESTROY: ${{ inputs.allow_destroy }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read environment settings
        id: settings
        run: bash ../.github/scripts/terraform-env.sh "${TARGET}" sa-terraform >> "${GITHUB_OUTPUT}"

      - name: Authenticate to ${{ inputs.environment }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ steps.settings.outputs.provider }}
          service_account: ${{ steps.settings.outputs.service_account }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false -reconfigure "-backend-config=envs/${TARGET}.backend.hcl"

      - name: Plan
        run: |
          terraform plan -input=false -no-color "-var-file=envs/${TARGET}.tfvars" -out=tfplan
          terraform show -json tfplan > plan.json
          {
            echo "### Terraform ${TARGET}"
            echo '```'
            terraform show -no-color tfplan | grep -E '^(Plan:|No changes\.)' || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check for destroys
        run: |
          destroys="$(bash ../.github/scripts/terraform-destroys.sh plan.json)"
          if [ -n "${destroys}" ] && [ "${ALLOW_DESTROY}" != "true" ]; then
            echo "::error::The plan for ${TARGET} destroys or replaces resources; nothing was applied:"
            echo "${destroys}"
            echo "If that's intended, run the Terraform workflow for ${TARGET} with 'Allow a plan that destroys or replaces resources'."
            {
              echo "**Stopped: destroys or replaces**"
              sed 's/^/- `/; s/$/`/' <<< "${destroys}"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      - name: Apply
        run: terraform apply -input=false -no-color tfplan
