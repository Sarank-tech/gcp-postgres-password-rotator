name: Terraform apply

# Applies one environment at commit "ref"; called by terraform.yaml (dev on
# merge, or Run workflow to repair one environment). Plans again first, then
# applies exactly that plan. Stops before applying if the plan destroys or
# replaces anything other than IAM bindings, unless allow_destroy is set.
# Promotions apply test, stage and prod from deploy.yaml instead.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        type: string
        required: true
      allow_destroy:
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  # Keep in step with terraform.yaml.
  TERRAFORM_VERSION: "1.17.0"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment's protection rules (reviewers, main only) apply here.
    environment: ${{ inputs.environment }}

    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: terraform

    env:
      TARGET: ${{ inputs.environment }}
      ALLOW_DESTROY: ${{ inputs.allow_destroy }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Read environment settings
        id: settings
        run: bash ../.github/scripts/terraform-env.sh "${TARGET}" sa-terraform >> "${GITHUB_OUTPUT}"

      - name: Authenticate to ${{ inputs.environment }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ steps.settings.outputs.provider }}
          service_account: ${{ steps.settings.outputs.service_account }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Apply
        run: |
          source ../.github/scripts/terraform.sh
          tf_apply "${TARGET}" "${ALLOW_DESTROY}"
