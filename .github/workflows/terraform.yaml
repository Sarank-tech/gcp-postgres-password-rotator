name: Terraform

# Infrastructure goes through PRs, like code:
#   pull request  plan for every environment, posted as a PR comment
#                 (read-only: sa-terraform-plan, no state lock)
#   merge         apply dev -> test -> stage, in that order; each waits for
#                 the approval its GitHub environment asks for, and stops if
#                 the one before failed
#   Run workflow  apply one environment again (e.g. after fixing access),
#                 or apply a plan that destroys resources ("allow destroy")
#
# Each environment needs terraform/bootstrap.sh once, and an entry in
# .github/terraform-envs.json. To add one: also add it to the matrix, the
# choice list and an apply job below.
on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/terraform-envs.json"
      - ".github/workflows/terraform*.yaml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/terraform-envs.json"
      - ".github/workflows/terraform*.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options: [dev, test, stage]
      allow_destroy:
        description: Allow a plan that destroys or replaces resources
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  # Keep in step with terraform-apply.yaml.
  TERRAFORM_VERSION: "1.17.0"

jobs:
  plan:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        env: [dev, test, stage]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}-${{ matrix.env }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: terraform

    env:
      TARGET: ${{ matrix.env }}
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read environment settings
        id: settings
        run: bash ../.github/scripts/terraform-env.sh "${TARGET}" sa-terraform-plan >> "${GITHUB_OUTPUT}"

      - name: Authenticate to ${{ matrix.env }}
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ steps.settings.outputs.provider }}
          service_account: ${{ steps.settings.outputs.service_account }}

      - name: Check sign-in
        if: steps.auth.outcome != 'success'
        run: |
          echo "::error::Can't sign in to ${TARGET} as sa-terraform-plan. Has terraform/bootstrap.sh run there? (test only accepts pull request runs once this pipeline's first change is applied.)"
          exit 1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      # A new environment has no state until its first apply, and creating it
      # takes a lock this read-only identity can't write. Plan it against an
      # empty local state instead: the same plan the first apply will make.
      - name: Init
        run: |
          bucket="$(sed -n 's/^bucket *= *"\(.*\)"/\1/p' "envs/${TARGET}.backend.hcl")"
          prefix="$(sed -n 's/^prefix *= *"\(.*\)"/\1/p' "envs/${TARGET}.backend.hcl")"
          if ! listing="$(gcloud storage ls "gs://${bucket}/**" 2>&1)"; then
            grep -q "matched no objects" <<< "${listing}" \
              || { echo "::error::Can't read gs://${bucket}: ${listing}"; exit 1; }
            listing=""
          fi
          if grep -qx "gs://${bucket}/${prefix}/default.tfstate" <<< "${listing}"; then
            terraform init -input=false -reconfigure "-backend-config=envs/${TARGET}.backend.hcl"
          else
            echo "::notice::No Terraform state for ${TARGET} yet: planning it as a new environment."
            printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
            terraform init -input=false
          fi

      # Read-only identity: it can't take the state lock, and doesn't need to.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock=false -no-color \
            "-var-file=envs/${TARGET}.tfvars" -out=tfplan > plan.log 2>&1
          rc=$?
          set -e
          if [ "${rc}" -eq 0 ]; then
            terraform show -no-color tfplan > plan.txt
            terraform show -json tfplan > plan.json
            echo "ok=true" >> "${GITHUB_OUTPUT}"
          else
            cp plan.log plan.txt
            echo "ok=false" >> "${GITHUB_OUTPUT}"
          fi
          cat plan.txt

      - name: Post the plan on the PR
        env:
          OK: ${{ steps.plan.outputs.ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- terraform-plan:${TARGET} -->"
          if [ "${OK}" = "true" ]; then
            summary="$(grep -E '^(Plan:|No changes\.)' plan.txt | head -1)" || true
            destroys="$(bash ../.github/scripts/terraform-destroys.sh plan.json)"
          else
            summary="❌ Plan failed"
            destroys=""
          fi
          {
            echo "${marker}"
            echo "### Terraform plan: ${TARGET}"
            echo ""
            echo "**${summary:-See the plan}** (commit ${SHA::7}, [run](${RUN_URL}))"
            if [ -n "${destroys}" ]; then
              echo ""
              echo "⚠️ **Destroys or replaces:**"
              sed 's/^/- `/; s/$/`/' <<< "${destroys}"
              echo ""
              echo "The apply after merge stops on these; see CICD.md (allow destroy)."
            fi
            echo ""
            echo "<details><summary>Show plan</summary>"
            echo ""
            echo '```'
            head -c 60000 plan.txt
            if [ "$(wc -c < plan.txt)" -gt 60000 ]; then
              echo ""
              echo "... cut off; the full plan is in the run log."
            fi
            echo '```'
            echo "</details>"
          } > comment.md
          cp comment.md "${GITHUB_STEP_SUMMARY}"

          id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -1)" || true
          if [ -n "${id}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md > /dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@comment.md > /dev/null
          fi

      - name: Fail if the plan failed
        if: steps.plan.outputs.ok != 'true'
        run: exit 1

  apply-dev:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.environment == 'dev')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yaml
    with:
      environment: dev
      allow_destroy: ${{ inputs.allow_destroy == true }}

  apply-test:
    needs: apply-dev
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.apply-dev.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'test'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yaml
    with:
      environment: test
      allow_destroy: ${{ inputs.allow_destroy == true }}

  apply-stage:
    needs: apply-test
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.apply-test.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'stage'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yaml
    with:
      environment: stage
      allow_destroy: ${{ inputs.allow_destroy == true }}
