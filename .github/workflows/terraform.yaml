name: Terraform

# Infrastructure changes go through PRs, like code, and reach each
# environment the same way code does:
#   pull request  plan for every environment, posted as PR comments
#                 (read-only: sa-terraform-plan, no state lock)
#   merge         apply dev (like the dev build). Test, stage and prod get
#                 the change with their next promotion PR (promote.yaml):
#                 its plan is shown on that PR and applied when it merges.
#   Run workflow  repair only: apply one environment again, at the
#                 infrastructure it has: dev main, test/stage the "infra"
#                 commit recorded in deploy/<env>.json (e.g. after fixing
#                 access, or "allow destroy" when a promotion's apply stopped)
#
# Each environment needs terraform/bootstrap.sh once, and an entry in
# .github/terraform-envs.json. To add one: also add it to the plan matrix
# and the choice list below.
on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/terraform-envs.json"
      - ".github/scripts/terraform*.sh"
      - ".github/workflows/terraform*.yaml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/terraform-envs.json"
      - ".github/scripts/terraform*.sh"
      - ".github/workflows/terraform*.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply again (at its recorded infrastructure)
        type: choice
        options: [dev, test, stage]
      allow_destroy:
        description: Allow a plan that destroys or replaces resources
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  # Keep in step with terraform-apply.yaml, promote.yaml and deploy.yaml.
  TERRAFORM_VERSION: "1.17.0"

jobs:
  plan:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        env: [dev, test, stage]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}-${{ matrix.env }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: terraform

    env:
      TARGET: ${{ matrix.env }}
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read environment settings
        id: settings
        run: bash ../.github/scripts/terraform-env.sh "${TARGET}" sa-terraform-plan >> "${GITHUB_OUTPUT}"

      - name: Authenticate to ${{ matrix.env }}
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ steps.settings.outputs.provider }}
          service_account: ${{ steps.settings.outputs.service_account }}

      - name: Check sign-in
        if: steps.auth.outcome != 'success'
        run: |
          echo "::error::Can't sign in to ${TARGET} as sa-terraform-plan. Has terraform/bootstrap.sh run there?"
          exit 1

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Plan
        id: plan
        run: |
          source ../.github/scripts/terraform.sh
          if tf_plan_readonly "${TARGET}"; then
            echo "ok=ok" >> "${GITHUB_OUTPUT}"
          else
            echo "ok=failed" >> "${GITHUB_OUTPUT}"
          fi
          cat plan.txt

      - name: Post the plan on the PR
        env:
          OK: ${{ steps.plan.outputs.ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          source ../.github/scripts/terraform.sh
          if [ "${TARGET}" = "dev" ]; then
            when="applied to dev when this PR is merged"
          else
            when="applied to ${TARGET} with its next promotion PR"
          fi
          tf_plan_markdown "${TARGET}" "${OK}" "Terraform plan: ${TARGET}" \
            "${when}; commit ${SHA::7}, [run](${RUN_URL})" > comment.md
          cp comment.md "${GITHUB_STEP_SUMMARY}"
          tf_post_comment "${PR}" "${TARGET}" comment.md

      - name: Fail if the plan failed
        if: steps.plan.outputs.ok != 'ok'
        run: exit 1

  # Merge: dev at main. Run workflow: the chosen environment at the
  # infrastructure it has (main if nothing is recorded yet).
  resolve:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.ref.outputs.environment }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Which infrastructure
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          env="dev"
          [ "${EVENT}" = "push" ] || env="${INPUT_ENV}"
          ref="${GITHUB_SHA}"
          if [ "${env}" != "dev" ] && [ -f "deploy/${env}.json" ]; then
            recorded="$(jq -r '.infra // empty' "deploy/${env}.json")"
            ref="${recorded:-${GITHUB_SHA}}"
          fi
          echo "environment=${env}" >> "${GITHUB_OUTPUT}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "Applying ${env} at ${ref::7}" >> "${GITHUB_STEP_SUMMARY}"

  apply:
    needs: resolve
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yaml
    with:
      environment: ${{ needs.resolve.outputs.environment }}
      ref: ${{ needs.resolve.outputs.ref }}
      allow_destroy: ${{ inputs.allow_destroy == true }}
